name: Local Studio
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'local_studio/**'
      - 'tests/local_studio/**'
      - 'windows/**'
      - 'requirements-local.txt'
      - '.github/workflows/local-studio.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install ffmpeg --no-progress -y
          $env:Path += ';C:\ProgramData\chocolatey\bin'
          'C:\ProgramData\chocolatey\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: API dependencies (no cloud stack, no model downloads)
        run: python -m pip install 'fastapi>=0.115.12,<1' 'pydantic>=2.10,<3' 'python-multipart>=0.0.22,<1' httpx
      - name: Local API, subtitles, and actual video export
        run: python -m unittest discover -s tests/local_studio -v
      - name: Windows PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
